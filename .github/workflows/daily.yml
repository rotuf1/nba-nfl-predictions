name: Daily predictions

on:
  workflow_dispatch: {}
  schedule:
    # Targets 11:50am / 3:40pm / 6:35pm America/New_York, year-round, plus 8:45am on
    # Sundays during the NFL season (Sep-Feb) so 9:30am ET international games get a
    # pre-kickoff pick recorded. 6:35pm is the
    # last look before 7pm NBA tips / 8:15pm NFL primetime kickoffs, to catch late
    # injury news; picks lock at kickoff, so a run that starts after a game has begun
    # leaves that game's last pre-kickoff pick in place. GitHub Actions
    # cron always runs in UTC and does not observe daylight saving time, so this is
    # split into an EDT set (UTC-4, roughly March-October) and an EST set (UTC-5,
    # roughly November-February) using calendar-month boundaries as an approximation --
    # actual US DST transitions happen mid-month, so there are up to ~2 weeks a year
    # (early/mid March, early November) where a run lands about an hour off from the
    # intended local time. Not exact, but self-correcting every DST change and not
    # worth the added complexity of day-precise overrides for a personal project.
    - cron: '50 15 * 3,4,5,6,7,8,9,10 *'       # EDT: 11:50am ET
    - cron: '40 19 * 3,4,5,6,7,8,9,10 *'       # EDT: 3:40pm ET
    - cron: '35 22 * 3,4,5,6,7,8,9,10 *'       # EDT: 6:35pm ET
    - cron: '50 16 * 11,12,1,2 *'              # EST: 11:50am ET
    - cron: '40 20 * 11,12,1,2 *'              # EST: 3:40pm ET
    - cron: '35 23 * 11,12,1,2 *'              # EST: 6:35pm ET
    - cron: '45 12 * 9,10 0'                   # EDT: Sun 8:45am ET (NFL international)
    - cron: '45 13 * 11,12,1,2 0'              # EST: Sun 8:45am ET (NFL international)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run daily prediction script
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python daily_run.py
